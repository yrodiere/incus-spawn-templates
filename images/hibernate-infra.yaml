name: tpl-hibernate-infra
description: Hibernate Infra Dev
parent: tpl-mydev
repos:
  - url: https://github.com/hibernate/hibernate-infra.git
    path: ~/infra
  - url: https://github.com/hibernate/hibernate-github-bot.git
    path: ~/github-bot
    prime: mvnd clean install -DskipTests
  - url: https://github.com/hibernate/hibernate-jenkins-pipeline-helpers.git
    path: ~/jenkins-pipeline-helpers
    prime: mvnd clean install -DskipTests
  - url: https://github.com/hibernate/hibernate-release-scripts.git
    path: ~/release-scripts
  - url: https://github.com/hibernate/hibernate-release-checker.git
    path: ~/release-checker
  - url: https://github.com/hibernate/awestruct-build-env.git
    path: ~/awestruct-build-env
