name: dev
description: My own dev environment
parent: dev-base
default-action: code-assistant
tools:
  # idea-backend — disabled until mkdir permission issue is resolved
  #- idea-backend:
  #    memory: 8g
  - code-assistant:
      default: codex:gpt-6.2-astra
      # Astra is the default for demanding development work. Sol is the lower-cost option.
      choices: "claude:claude-opus-4-6,codex:gpt-6.2-sol,codex:gpt-6.2-astra,opencode:anthropic/claude-opus-4-6,gemini,copilot,bob"
  - claude:
      model: claude-opus-4-6
      attribution-commit: ""
      attribution-pr: ""
      editor-mode: vim
  - headroom
  - opencode:
      provider: anthropic
      model: claude-opus-4-6
      small-model: claude-haiku-4-5
  - codex
  - gemini-cli
  - copilot
  - atlassian-mcp
  - develocity-mcp
host-resources:
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/AGENTS.md
    path: ~/.claude/CLAUDE.md
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/AGENTS.md
    path: ~/.config/opencode/AGENTS.md
    mode: copy
