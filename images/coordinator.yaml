name: coordinator
description: Lightweight coordinator for driving work across isx instances
parent: tpl-minimal
agent_note: |
  Coordinator workflow conventions:

  Never list a PR as needing review once it is merged or closed -- drop it from
  status updates and review lists entirely.

  Before reporting a PR's status (e.g. calling it "open" or listing it as
  needing review), verify its current state via `gh pr view <url> --json
  state,mergedAt` rather than assuming it is still in the state it was last seen
  in -- PRs opened earlier in a session may have been merged or closed since.

  Whenever a PR or issue is mentioned as something to review, always give the
  full URL (e.g. https://github.com/owner/repo/pull/N), never a bare #N reference.

  Delegate investigation and research work (reading docs, source, issues,
  reproducing bugs) to a worker agent via isx MCP tools, rather than doing it
  directly in the coordinator session. Reserve direct shell commands, gh, and
  URL fetches for light checks -- confirming a PR's current state or diff after
  an agent reports, `gh auth status`, etc. -- not substantive work.

  Default delegate() calls to agent: "codex" explicitly rather than leaving
  agent unset. An explicit agent parameter on delegate() always wins over the
  target template's own priority-based default, which currently favors claude
  wherever it is installed -- essentially every template here. This is a
  deliberate per-call choice to prefer OpenAI/Codex for delegate work.
  Override when a specific task is better suited to a different agent, e.g. the
  user explicitly asks for Claude or Codex proves unsuitable for a task.

  For routine delegated coding, prefer Codex GPT-6.2 Sol (`gpt-6.2-sol`) or
  Claude Sonnet (`claude-sonnet-5-5`). For demanding delegated work such as
  debugging across services or large refactors, prefer Codex GPT-6.2 Astra
  (`gpt-6.2-astra`) or Claude Opus (`claude-opus-4-6`).

  After dispatching a delegate or background exec, immediately call task_status
  with a generous wait_seconds (minutes, not seconds) and re-issue a waiting
  call as soon as any prior one returns still-running.  When wait_seconds is
  exceeded the call converts into a tracked background task whose completion
  arrives as an automatic notification -- a new event in the conversation, not
  something requiring the user to ask.  Never call task_status once, see "still
  running," report that to the user and go quiet until prompted -- the
  automatic-notification mechanism makes manual follow-up unnecessary.

  PRs against yrodiere/-owned repos can be opened directly once an agent's work
  is verified. A PR touching a third-party repo (e.g. Sanne/incus-spawn) needs
  the repo owner's explicit go-ahead first -- report the proposed diff and PR
  description and wait, don't push it.

  When a delegated agent reports a genuine open question it cannot resolve on its
  own, relay it to the repo owner and continue that same agent's task (not a new
  one) once an answer comes back.

  After adopt_instance succeeds on an instance from a prior/ended session,
  send_message to the old task_id fails ("no task '<id>' in this session") even
  though the instance is adopted. Workaround: recover the last report manually
  if needed (exec into the instance, read
  ~/.isx-mcp/tasks/<old_task_id>/events-N.jsonl for the highest N, extract the
  "type":"result" event's result field), then continue with
  delegate(instance="<name>", instruction="...") instead of send_message -- this
  starts a fresh task in the same instance, which still has the prior work's git
  state on disk even though the old conversation is not resumable.

  PR-authorization, more precisely than the yrodiere/-vs-third-party rule above:
  pushing follow-up commits to an agent's own already-open PR (review fixes,
  rebasing, related additions) does not need renewed go-ahead, even on a
  third-party repo -- only opening a brand-new PR needs explicit go-ahead.
  Separately: being told to "send a PR" or "fix X" as initial framing is not
  blanket authorization to open it -- default to preparing, verifying, and
  holding for explicit go-ahead on the first open, unless the instruction is
  unambiguous about opening immediately.
tools:
  # ── Coordinator front-end: opencode with OpenAI ─────────────────────
  # The coordinator orchestrates delegates and makes tool calls; it does not
  # generate code itself. gpt-6-luna is fast and suited for orchestration.
  #
  # To revert the coordinator front-end to Claude Code:
  #   1. Uncomment the claude and headroom entries below.
  #   2. Comment out or remove the opencode entry.
  #   3. Change default-action to: claude
  - opencode:
      provider: openai
      model: gpt-6-luna
  # To use an Anthropic model in opencode instead:
  #   - opencode:
  #       provider: anthropic
  #       model: claude-sonnet-5-5
  # To use a Gemini model in opencode instead:
  #   - opencode:
  #       provider: google
  #       model: gemini-3.8-flash

  # ── Claude Code: disabled ────────────────────────────────────────────
  # Uncomment to restore Claude Code as the front-end: change
  # default-action to claude.
  # - claude:
  #     model: claude-sonnet-5-5
  #     attribution-commit: ""
  #     attribution-pr: ""
  # - headroom

  - gh
  - atlassian-mcp
  - develocity-mcp
  - zsh
default-action: opencode
packages:
  - iptables-nft
  - jq
  - gawk
host-resources:
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/zshrc
    path: ~/.zshrc
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/gitconfig
    path: ~/.gitconfig
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/AGENTS.md
    path: ~/.claude/CLAUDE.md
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/AGENTS.md
    path: ~/.config/opencode/AGENTS.md
    mode: copy
  - source: ~/.ssh/agent-authorized-keys
    path: .ssh/authorized-keys
    mode: copy
skills:
  - yrodiere/agent-skills
coordinator:
  control-over:
    - hibernate-deps
    - hibernate-infra
    - hibernate-orm
    - hibernate-reactive
    - hibernate-search
    - hibernate-validator
    - incus-spawn
    - incus-spawn-container
    - quarkus
    - quarkus-infra
    - tamboui
    - tools
    - dev
    - websites
    - wildfly
