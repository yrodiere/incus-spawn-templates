name: tpl-mydev-base
description: Base for tpl-mydev, with the slow, hopefully rarely-updated part of setup.
parent: tpl-minimal
tools:
  #- tmux
  #- starship
  - sdkman
  - sdkman-java
  - sdkman-maven
  - sdkman-quarkus
  - podman-full
  - vscode-remote
  - zsh
  - sdkman-mvnd
  - sdkman-jbang
  - bob:
      max-session-turns: -1
      compression-threshold: "0.6"
      checkpointing: true
  - gh
packages:
  - tig
  - neovim
  - jq
  - bc
  - zsh
  - tree
  - unzip
  - gawk
  - make
  - patch
  - lsof
  - file
  - wget
host-resources:
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/zshrc
    path: ~/.zshrc
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/gitconfig
    path: ~/.gitconfig
    mode: copy
  - source: ~/.local/share/containers/storage
    path: /mnt/podman-host-storage
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/podman-storage.conf
    path: /etc/containers/storage.conf
    mode: copy
  - source: ~/.ssh/agent-authorized-keys
    path: .ssh/authorized-keys
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/AGENTS.md
    path: ~/.bob/AGENTS.md
    mode: copy
skills:
  - yrodiere/claude-skills
