name: tpl-mydev-base
description: Base for tpl-mydev, with the slow, hopefully rarely-updated part of setup.
parent: tpl-minimal
tools:
  #- tmux
  #- starship
  - sdkman
  - sdkman-java
  - sdkman-maven
  - sdkman-quarkus
  - podman-full
  - vscode-remote
  - zsh
  - mvnd
  - bob
  - gh
packages:
  - tig
  - neovim
  - jq
  - bc
  - zsh
  - tree
  - unzip
  - gawk
  - make
  - patch
  - lsof
  - file
  - wget
host-resources:
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/.zshrc
    path: ~/.zshrc
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/.gitconfig
    path: ~/.gitconfig
    mode: copy
  - source: ~/.local/share/containers/storage
    path: /mnt/podman-host-storage
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/podman-storage.conf
    path: /etc/containers/storage.conf
    mode: copy
  - source: ~/.ssh/agent-authorized-keys
    path: .ssh/authorized-keys
    mode: copy
