name: tpl-mydev
description: My own dev environment
parent: tpl-mydev-base
default-action: claude
tools:
  - zsh
  - mvnd
  # Doesn't work, see https://quarkusio.zulipchat.com/#narrow/channel/187038-dev/topic/Incus.20Spawn.20.28isx.29.20-.20bob/with/619499834
  #- bob
  - opencode:
      model: anthropic/claude-opus-4-6
      small-model: anthropic/claude-haiku-4-5
  - claude:
      model: claude-opus-4-6
      attribution-commit: "Assisted-By: Claude Code <noreply@anthropic.com>"
      attribution-pr: ""
      editor-mode: vim
skills:
  - yrodiere/claude-skills
files:
  - path: /home/agentuser/.claude/CLAUDE.md
    owner: agentuser
    content: |
      At the start of each session, load the `incus-spawn` skill.
      This environment is an incus-spawn VM with sudo access and a minimal package set.

      Before any `git push` or `gh pr create`, load the `git-agent-account` skill.
      You are authenticated as a dedicated agent account, not the repo owner.
host-resources:
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/.zshrc
    path: ~/.zshrc
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/.gitconfig
    path: ~/.gitconfig
    mode: copy
  - source: ~/.local/share/containers/storage
    path: /mnt/podman-host-storage
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/podman-storage.conf
    path: /etc/containers/storage.conf
    mode: copy
  - source: ~/.ssh/agent-authorized-keys
    path: .ssh/authorized-keys
    mode: readonly
