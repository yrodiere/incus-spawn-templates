name: tpl-mydev
description: My own dev environment
parent: tpl-mydev-base
default-action: code-assistant
tools:
  # idea-backend — disabled until mkdir permission issue is resolved
  #- idea-backend:
  #    memory: 8g
  - code-assistant:
      default: claude
  - claude:
      model: claude-opus-4-6
      attribution-commit: ""
      attribution-pr: ""
      editor-mode: vim
  # headroom — disabled until Sanne/incus-spawn#670 is fixed
  #- headroom
  - opencode:
      model: anthropic/claude-opus-4-6
      small-model: anthropic/claude-haiku-4-5
  - atlassian-mcp
host-resources:
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/AGENTS.md
    path: ~/.claude/CLAUDE.md
    mode: copy
  - source: ~/workspaces/incus-spawn/incus-spawn-templates/files/AGENTS.md
    path: ~/.config/opencode/AGENTS.md
    mode: copy
