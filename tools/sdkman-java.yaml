name: sdkman-java
description: OpenJDK installed via SDKMAN!

requires:
  - sdkman

parameters:
  version:
    type: string
    default: "25.0.4-tem"
    description: "SDKMAN! Java version identifier (e.g. 25.0.4-tem, 21-tem, 25-open)"

run_as_user:
  - |
    source ~/.sdkman/bin/sdkman-init.sh
    sdk install java ${param_version}

verify: test -x /home/agentuser/.sdkman/candidates/java/current/bin/java
