name: incus
description: Nested Incus daemon for recursive development

packages:
  - incus
  - btrfs-progs

run:
  - systemctl enable --now incus
  - usermod -aG incus-admin agentuser
  - |
    for i in $(seq 1 30); do
      incus admin init --minimal 2>/dev/null && break
      sleep 1
    done
  - incus storage create cow btrfs size=10GiB

verify: incus storage list --format csv
ready: systemctl is-active incus
