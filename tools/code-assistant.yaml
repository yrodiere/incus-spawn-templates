name: code-assistant
description: Smart code assistant launcher — resumes the most recent AI coding session across claude, codex, gemini, copilot, pi, bob and opencode
packages:
  - sqlite
parameters:
  default:
    type: string
    description: "Default assistant or assistant:model for first launch"
    pattern: "^(claude|codex|gemini|copilot|pi|bob|opencode)(:[A-Za-z0-9_./:@+-]+)?$"
    optional: true
    reconfigurable: true
  choices:
    type: string
    description: "Comma-separated assistant[:model] choices, e.g. claude:opus,claude:sonnet,codex:gpt-5.3-codex,opencode:anthropic/claude-sonnet-4-6,gemini,copilot,bob. Omit to offer all installed assistants with their configured models. Bob does not support model selection."
    pattern: "^(claude|codex|gemini|copilot|pi|bob|opencode)(:[A-Za-z0-9_./:@+-]+)?(,(claude|codex|gemini|copilot|pi|bob|opencode)(:[A-Za-z0-9_./:@+-]+)?)*$"
    optional: true
    reconfigurable: true
run:
  - |
    cat > /usr/local/bin/code-assistant << 'SCRIPT'
    #!/bin/bash
    # code-assistant: resumes the most recent AI coding session across
    # installed assistants. On first launch (or with --new), prompts to
    # pick an assistant/model and working directory.
    case "${1:-}" in
      ""|--new) ;;
      *) echo "Usage: code-assistant [--new]" >&2; exit 2 ;;
    esac

    DEFAULT_TOOL=$(cat ~/.config/code-assistant-default 2>/dev/null)
    : "${DEFAULT_TOOL:=claude}"

    # ── Detect installed tools ──────────────────────────────────────
    declare -a TOOLS
    command -v claude   >/dev/null 2>&1 && TOOLS+=(claude)
    command -v codex    >/dev/null 2>&1 && TOOLS+=(codex)
    command -v gemini   >/dev/null 2>&1 && TOOLS+=(gemini)
    command -v copilot  >/dev/null 2>&1 && TOOLS+=(copilot)
    command -v pi       >/dev/null 2>&1 && TOOLS+=(pi)
    command -v bob      >/dev/null 2>&1 && TOOLS+=(bob)
    command -v opencode >/dev/null 2>&1 && TOOLS+=(opencode)

    if [ ${#TOOLS[@]} -eq 0 ]; then
      echo "No code assistants found (claude, codex, gemini, copilot, pi, bob, opencode)."
      exec bash --login
    fi

    # ── Launch helpers ──────────────────────────────────────────────
    launch_claude()  { claude --continue || claude; }
    launch_codex()   { codex resume --last || codex; }
    launch_gemini()  { gemini --resume latest || gemini; }
    launch_copilot() { copilot --continue || copilot; }
    launch_pi()      { pi --continue || pi; }
    launch_bob()     { bob chat --resume --auto-approve || bob chat --auto-approve; }
    launch_opencode(){ opencode --continue || opencode; }

    start_assistant() {
      local selection=$1 tool=${1%%:*} model=""
      local -a args=()
      [[ "$selection" == *:* ]] && model=${selection#*:}
      [ -n "$model" ] && args+=(--model "$model")
      case "$tool" in
        bob) bob chat --auto-approve ;;
        *) "$tool" "${args[@]}" ;;
      esac
    }

    # ── Find the most recent session across all installed tools ─────
    best_tool="" best_dir="" best_ts=0

    for tool in "${TOOLS[@]}"; do
      ts=0 dir=""
      case "$tool" in
        claude)
          f=$(find ~/.claude/projects -name '*.jsonl' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1)
          if [ -n "$f" ]; then
            ts=${f%%.*}
            path=${f#* }
            dir=$(grep -m1 -o '"cwd":"[^"]*"' "$path" 2>/dev/null | cut -d'"' -f4)
          fi
          ;;
        codex)
          f=$(find ~/.codex/sessions -name '*.jsonl' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1)
          if [ -n "$f" ]; then
            ts=${f%%.*}
            path=${f#* }
            dir=$(grep -m1 -o '"cwd":"[^"]*"' "$path" 2>/dev/null | cut -d'"' -f4)
          fi
          ;;
        gemini)
          f=$(find ~/.gemini/tmp -path '*/chats/session-*.jsonl' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1)
          if [ -n "$f" ]; then
            ts=${f%%.*}
            path=${f#* }
            slug=$(basename "$(dirname "$(dirname "$path")")")
            dir=$(jq -r --arg s "$slug" \
              '.projects | to_entries[] | select(.value == $s) | .key' \
              ~/.gemini/projects.json 2>/dev/null | head -1)
          fi
          ;;
        copilot)
          f=$(find ~/.copilot/session-state -name 'workspace.yaml' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1)
          if [ -n "$f" ]; then
            ts=${f%%.*}
            path=${f#* }
            dir=$(grep -m1 '^cwd:' "$path" 2>/dev/null | sed 's/^cwd: *//')
          fi
          ;;
        pi)
          f=$(find ~/.pi/agent/sessions -name '*.jsonl' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1)
          if [ -n "$f" ]; then
            ts=${f%%.*}
            path=${f#* }
            dir=$(grep -m1 -o '"cwd":"[^"]*"' "$path" 2>/dev/null | cut -d'"' -f4)
          fi
          ;;
        bob)
          row=$(sqlite3 -separator '|' -noheader ~/.bob/db/bob.db \
            "SELECT updated_at/1000, REPLACE(project_id,'file:','') \
             FROM tasks WHERE parent_id IS NULL \
             ORDER BY updated_at DESC LIMIT 1" 2>/dev/null)
          if [ -n "$row" ]; then
            ts=${row%%|*}
            dir=${row#*|}
          fi
          ;;
        opencode)
          row=$(sqlite3 -separator '|' -noheader ~/.local/share/opencode/opencode.db \
            "SELECT CAST(strftime('%s', time_updated) AS INTEGER), directory \
             FROM session ORDER BY time_updated DESC LIMIT 1" 2>/dev/null)
          if [ -n "$row" ]; then
            ts=${row%%|*}
            dir=${row#*|}
          fi
          ;;
      esac

      if [ -n "$dir" ] && [ -d "$dir" ] && [ "$ts" -gt "$best_ts" ] 2>/dev/null; then
        best_ts=$ts best_tool=$tool best_dir=$dir
      fi
    done

    # ── Resume the most recent session ──────────────────────────────
    if [ "${1:-}" != --new ] && [ -n "$best_tool" ]; then
      cd "$best_dir" || true
      "launch_$best_tool"
      exit $?
    fi

    # ── First launch — prompt to pick ───────────────────────────────
    declare -a REPOS
    while IFS= read -r gitdir; do
      REPOS+=("$(dirname "$gitdir")")
    done < <(find ~ -maxdepth 2 -name '.git' -type d 2>/dev/null | sort)
    [ ${#REPOS[@]} -eq 0 ] && REPOS+=("$(pwd)")

    # Only offer configured combinations whose assistant is installed.
    declare -a SELECTIONS
    choices=$(cat ~/.config/code-assistant-choices 2>/dev/null)
    if [ -z "$choices" ]; then
      SELECTIONS=("${TOOLS[@]}")
    else
      IFS=',' read -r -a configured <<< "$choices"
      for selection in "${configured[@]}"; do
        tool=${selection%%:*}
        case "$tool" in
          claude|codex|gemini|copilot|pi|bob|opencode) ;;
          *) echo "Ignoring unknown assistant: $tool" >&2; continue ;;
        esac
        if [[ "$tool" == bob && "$selection" == *:* ]]; then
          echo "Ignoring $selection: Bob has no model selection flag." >&2
          continue
        fi
        for installed in "${TOOLS[@]}"; do
          if [ "$tool" = "$installed" ]; then
            SELECTIONS+=("$selection")
            break
          fi
        done
      done
    fi
    if [ ${#SELECTIONS[@]} -eq 0 ]; then
      echo "No configured code assistant choices are available." >&2
      exit 1
    fi

    declare -a OPT_LABELS OPT_SELECTIONS OPT_DIRS
    default_dir=$(pwd)
    add_option() {
      local selection=$1 r=$2 label=$1
      [[ "$selection" != *:* ]] && label="$selection (configured model)"
      OPT_LABELS+=("$label  $(basename "$r")  ($r)")
      OPT_SELECTIONS+=("$selection")
      OPT_DIRS+=("$r")
    }

    # Prefer the exact default combination, or its assistant when no
    # model was specified. Preserve parameter order within each group.
    for preferred in yes no; do
      for selection in "${SELECTIONS[@]}"; do
        match=no
        if [ "$selection" = "$DEFAULT_TOOL" ] ||
           { [[ "$DEFAULT_TOOL" != *:* ]] && [ "${selection%%:*}" = "$DEFAULT_TOOL" ]; }; then
          match=yes
        fi
        [ "$match" = "$preferred" ] || continue
        for r in "${REPOS[@]}"; do
          [ "$r" = "$default_dir" ] && add_option "$selection" "$r"
        done
        for r in "${REPOS[@]}"; do
          [ "$r" != "$default_dir" ] && add_option "$selection" "$r"
        done
      done
    done

    if [ ${#OPT_LABELS[@]} -eq 1 ]; then
      cd "${OPT_DIRS[0]}" || exit 1
      start_assistant "${OPT_SELECTIONS[0]}"
      exit $?
    fi

    echo ""
    echo "  Pick a code assistant, model, and working directory:"
    echo ""
    for i in "${!OPT_LABELS[@]}"; do
      if [ "$i" -eq 0 ]; then
        printf "    \033[1m%d) %s  [default]\033[0m\n" $((i+1)) "${OPT_LABELS[$i]}"
      else
        printf "    %d) %s\n" $((i+1)) "${OPT_LABELS[$i]}"
      fi
    done
    echo ""
    printf "  Choice [1]: "
    read -r choice
    [ -z "$choice" ] && choice=1
    if [[ ! "$choice" =~ ^[0-9]{1,6}$ ]]; then
      echo "  Invalid choice." >&2
      exit 1
    fi
    idx=$((10#$choice - 1))

    if [ "$idx" -lt 0 ] || [ "$idx" -ge "${#OPT_LABELS[@]}" ]; then
      echo "  Invalid choice."
      exec bash --login
    fi

    cd "${OPT_DIRS[$idx]}" || exit 1
    start_assistant "${OPT_SELECTIONS[$idx]}"
    SCRIPT
    chmod +x /usr/local/bin/code-assistant
    d='${param_default}'
    case "$d" in '${param_'*) d=claude ;; esac
    mkdir -p /home/agentuser/.config
    echo "$d" > /home/agentuser/.config/code-assistant-default
    choices='${param_choices}'
    case "$choices" in '${param_'*) choices='' ;; esac
    printf '%s\n' "$choices" > /home/agentuser/.config/code-assistant-choices
    chown -R agentuser:agentuser /home/agentuser/.config
actions:
  - label: "Code Assistant"
    type: shell
    command: code-assistant
    auto_return: true
