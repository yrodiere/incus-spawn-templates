name: podman-full
description: Podman with compose and permissive short image name resolution

requires:
  - podman

packages:
  - podman-compose

run:
  # Workaround: incus exec bypasses PAM, so no systemd user instance
  # starts for agentuser. Rootless podman needs it for cgroup management
  # and falls back to cgroupfs with noisy warnings without it.
  # See https://github.com/Sanne/incus-spawn/issues/415
  - loginctl enable-linger agentuser

files:
  - path: /etc/containers/registries.conf.d/10-short-names.conf
    content: |
      # Resolve short image names (e.g. postgres:18) to docker.io without prompting.
      short-name-mode = "permissive"
      unqualified-search-registries = ["docker.io"]

verify: podman-compose --version
