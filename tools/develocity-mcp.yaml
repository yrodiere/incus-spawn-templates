name: develocity-mcp
description: Develocity MCP server for build scans and test history
env:
  - name: DEVELOCITY_COMMONHAUS_AUTH
    value: develocity-commonhaus-placeholder
  - name: DEVELOCITY_QUARKUS_AUTH
    value: develocity-quarkus-placeholder
proxy:
  config-namespace: develocity
  placeholders:
    - env: DEVELOCITY_COMMONHAUS_AUTH
      prefix: develocity-commonhaus-
    - env: DEVELOCITY_QUARKUS_AUTH
      prefix: develocity-quarkus-
  configuration:
    commonhaus-access-key:
      config-path: "commonhausAccessKey"
      description: "Develocity access key for develocity.commonhaus.dev"
      secret: true
      help:
        - "Your account needs the accessBuildDataViaApiAndMcp permission"
        - "(included in the Developer role)."
        - "For cross-project analytics, also:"
        - "  readAccessAllBuildDataWithOrWithoutAssociatedProject"
        - ""
        - "Generate a key at My settings > Access keys > Generate."
        - ""
        - "The credential is injected only for /mcp requests, so"
        - "Gradle/Maven builds on the same domain cannot use it to"
        - "publish scans or write cache data."
        - ""
        - "Press Enter to skip if you have no access to this instance."
    quarkus-access-key:
      config-path: "quarkusAccessKey"
      description: "Develocity access key for ge.quarkus.io"
      secret: true
      help:
        - "Same as above. Press Enter to skip if you have no access"
        - "to this instance."
  auth:
    - domains:
        - develocity.commonhaus.dev
      paths:
        - /mcp
      type: bearer
      token: "${commonhaus-access-key}"
    - domains:
        - ge.quarkus.io
      paths:
        - /mcp
      type: bearer
      token: "${quarkus-access-key}"
mcp:
  - name: develocity-commonhaus
    description: Build scans and test history on develocity.commonhaus.dev
    url: https://develocity.commonhaus.dev/mcp
    bearer-token-env: DEVELOCITY_COMMONHAUS_AUTH
  - name: develocity-quarkus
    description: Build scans and test history on ge.quarkus.io
    url: https://ge.quarkus.io/mcp
    bearer-token-env: DEVELOCITY_QUARKUS_AUTH
